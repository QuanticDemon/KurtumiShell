<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330" role="img" aria-labelledby="t">
  <title id="t">Batería horizontal rosa con un conejito kawaii encima</title>

  <!-- polo positivo -->
  <rect x="403" y="213" width="42" height="54" rx="12" fill="#be185d"/>

  <!-- cuerpo de la batería -->
  <rect x="55" y="170" width="360" height="140" rx="30" fill="#ec4899"/>

  <!-- celdas de carga -->
  <rect x="81" y="205" width="68" height="70" rx="12" fill="#fdf2f8"/>
  <rect x="161" y="205" width="68" height="70" rx="12" fill="#fdf2f8"/>
  <rect x="241" y="205" width="68" height="70" rx="12" fill="#fdf2f8"/>
  <rect x="321" y="205" width="68" height="70" rx="12" fill="#f9a8d4"/>

  <!-- orejas -->
  <g transform="rotate(-14 190 108)">
    <ellipse cx="190" cy="64" rx="17" ry="48" fill="#fce7f3"/>
    <ellipse cx="190" cy="70" rx="8" ry="32" fill="#f9a8d4"/>
  </g>
  <g transform="rotate(14 280 108)">
    <ellipse cx="280" cy="64" rx="17" ry="48" fill="#fce7f3"/>
    <ellipse cx="280" cy="70" rx="8" ry="32" fill="#f9a8d4"/>
  </g>

  <!-- cabeza ancha -->
  <ellipse cx="235" cy="138" rx="82" ry="48" fill="#fce7f3"/>

  <!-- mejillas -->
  <ellipse cx="178" cy="162" rx="10" ry="6.5" fill="#f9a8d4"/>
  <ellipse cx="292" cy="162" rx="10" ry="6.5" fill="#f9a8d4"/>

  <!-- ojitos ovalados, bien separados -->
  <ellipse cx="191" cy="146" rx="5.5" ry="7" fill="#500724"/>
  <ellipse cx="279" cy="146" rx="5.5" ry="7" fill="#500724"/>

  <!-- naricita y boquita -->
  <ellipse cx="235" cy="152" rx="6" ry="4" fill="#db2777"/>
  <path d="M228 160q3.500 5 7 0q3.500 5 7 0" stroke="#500724" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
